<script>
function filterProducts(type){
  document.querySelectorAll('.product').forEach(p=>{
    if(type==='all'){
      p.style.display='block';
    } else {
      p.style.display = p.classList.contains(type) ? 'block' : 'none';
    }
  });
}

function order(code,type,sizeId,colorId){
  const size=document.getElementById(sizeId).value;
  const color=document.getElementById(colorId).value;
  const msg=`طلب جديد من Milton Club 👕
--------------------
الكود: ${code}
النوع: ${type}
المقاس: ${size}
اللون: ${color}

برجاء تأكيد السعر وموعد التسليم`;

  window.open("https://wa.me/201095983094?text="+encodeURIComponent(msg),"_blank");
}
</script>
